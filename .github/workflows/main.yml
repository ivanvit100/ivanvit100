name: Update Activity Graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ivanvit100
          options: bg_color=333333&color=FFC33D&line=FF7F26&point=EA8000&area=true&area_color=FF7F26&hide_border=true&custom_title=Contribution Activity
          output_path: profile/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/activity-graph.svg
          git diff --staged --quiet || git commit -m "Update activity graph"
          git push
